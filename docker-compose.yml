services:
  tailscale:
    image: tailscale/tailscale:latest
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - ts_state:/var/lib/tailscale
    networks: [internal]
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  internal:
    internal: true
volumes:
  ts_state:
